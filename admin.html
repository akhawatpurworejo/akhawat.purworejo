const wh=t=>`<h3 style="margin-top:28px">${t}</h3>`;
function wsync(){document.querySelectorAll('[data-w]').forEach(el=>set(W,el.dataset.w,el.value))}
function wclr(p){wsync();set(W,p,'');render()}
function rs(file,max){return new Promise(res=>{if(!/^image\/(jpe?g|png|webp)$/.test(file.type))return res(file);const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.85)};im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
async function wup(el,p){const f=el.files[0];if(!f)return;wsync();const b=await rs(f,1400),isj=b!==f,n=Date.now()+'-'+f.name.replace(/[^\w]/g,'').slice(0,20)+(isj?'.jpg':'.'+(f.name.split('.').pop()||'img').replace(/[^\w]/g,''));
 const {error}=await sb.storage.from('media').upload(n,b,isj?{contentType:'image/jpeg'}:{});if(error)return alert(error.message);set(W,p,sb.storage.from('media').getPublicUrl(n).data.publicUrl);render()}
async function wsave(){wsync();const {error}=await sb.from('settings').upsert({key:'web',value:W});alert(error?error.message:'Tersimpan ✓ Perubahan tampil di situs saat halamannya dimuat ulang.')}

function admin(){
 if(!user)return `<section style="max-width:380px"><h2>Login Admin</h2><form onsubmit="login(event)"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><p class="err" id="err"></p><button class="btn">Masuk</button> <a href="#/">Kembali</a></form></section>`;
 const tabs=[['beranda','Beranda'],['kontak','Kontak'],['testi','Testimoni'],['teks','Lama: Teks'],['layanan','Lama: Layanan'],['desain','Lama: Desain']];

 if(tab==='layanan')b=S.services.map((s,i)=>`<div class="card" style="margin-bottom:14px"><b>${i+1}. ${esc(s.name)}</b> ${s.hidden?'<span class=badge>disembunyikan</span>':''}${fld(`services.${i}.name`,'Nama')}${fld(`services.${i}.icon`,'Ikon (emoji)')}${fld(`services.${i}.img`,'Gambar (URL / unggah)',{img:1})}${fld(`services.${i}.short`,'Deskripsi singkat')}${fld(`services.${i}.detail`,'Penjelasan',{t:1})}${fld(`services.${i}.examples`,'Contoh layanan (satu per baris)',{r:4})}
 <button class="btn s" onclick="svA(${i},'up')">↑</button> <button class="btn s" onclick="svA(${i},'down')">↓</button> <button class="btn o s" onclick="svA(${i},'hide')">${s.hidden?'Tampilkan':'Sembunyikan'}</button> <button class="btn r s" onclick="svA(${i},'del')">Hapus</button></div>`).join('')+`<button class="btn o" onclick="svAdd()">+ Tambah layanan</button>`;
 if(tab==='desain')b=[['colors.bg','Warna latar',{c:1}],['colors.card','Warna kartu',{c:1}],['colors.accent','Warna aksen/tombol',{c:1}],['colors.dark','Warna teks',{c:1}],['logo','Logo',{img:1}],['hero_img','Gambar/ilustrasi utama',{img:1}]].map(a=>fld(a[0],a[1],a[2])).join('')+['head','body'].map(k=>`<label>Font ${k==='head'?'judul':'isi'}<select data-p="fonts.${k}">${['Playfair Display','Lora','Cormorant Garamond','Poppins','Nunito','Montserrat'].map(x=>`<option ${S.fonts[k]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('');
 if(tab==='testi')b=[...T].sort((a,c)=>(a.status==='pending'?0:1)-(c.status==='pending'?0:1)).map(t=>`<div class="card" style="margin-bottom:12px"><span class="badge">${{pending:'menunggu',approved:'disetujui',rejected:'ditolak'}[t.status]}</span> ${t.featured?'<span class=badge>★ unggulan</span>':''} ${t.consent?'':'<span class="badge">TIDAK izin publikasi</span>'} <span class="badge">${t.show_name?'nama ditampilkan':'inisial saja'}</span><div class="st">${stars(t.rating)}</div><b>${esc(t.name)}</b> <small>${esc(t.service)}${t.product?' · '+esc(t.product):''}</small><p>${esc(t.story)}</p>${t.feedback?`<small>Saran: ${esc(t.feedback)}</small>`:''}
 <input id="dn-${t.id}" placeholder="Nama tampilan (opsional)" value="${esc(t.display_name||'')}"><p><button class="btn s" ${t.consent?'':'disabled'} onclick="tA('${t.id}',{status:'approved'})">Setujui</button> <button class="btn o s" onclick="tA('${t.id}',{status:'rejected',featured:false})">Tolak</button> <button class="btn o s" onclick="tA('${t.id}',{featured:${!t.featured}})">${t.featured?'Lepas unggulan':'Unggulkan'}</button> <button class="btn o s" onclick="tA('${t.id}',{display_name:$('#dn-${t.id}').value.trim()||null})">Simpan nama</button> <button class="btn r s" onclick="tDel('${t.id}')">Hapus</button></p></div>`).join('')||'<p>Belum ada testimoni masuk.</p>';
 return `<div class="wrap adm"><p><a href="#/">← Lihat website</a> · <a onclick="logout()" style="cursor:pointer">Keluar</a></p><h2>Dashboard Admin</h2><div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${tab===k?'':'o'} s" onclick="setTab('${k}')">${l}</button>`).join('')}</div>${b}${tab==='testi'?'':'<p style="position:sticky;bottom:0;background:var(--bg);padding:10px 0;margin:0"><button class="btn" onclick="'+(tab==='beranda'||tab==='kontak'?'wsave()':'save()')+'">Simpan Perubahan</button></p>'}</div>`}
