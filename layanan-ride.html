 <section class="sp-cta"><div class="wrap"><div class="sp-box"><svg class="sp-curve sp-orn" viewBox="0 0 200 60" aria-hidden="true"><path d="M4 42c40 10 70-30 100-10s60 10 92-14"/><path transform="translate(76 4) scale(1.2)" d="M12 20s-7-4.500-7-10a4 4 0 017-2.500A4 4 0 0119 10c0 5.500-7 10-7 10z"/></svg><div><h2 data-k="svc.cta_h">Yuk, ceritakan kebutuhanmu</h2><p data-k="svc.cta_p">Kami siap membantu lewat WhatsApp. Sampaikan kebutuhanmu, lalu kita atur detailnya bersama.</p></div><button class="btn solid" data-open><svg class="wi" viewBox="0 0 24 24" aria-hidden="true">${ICO.wa}</svg><span>${v.bo||"Pesan layanan ini"}</span><span aria-hidden="true">→</span></button></div></div></section>
 <dialog id="dlg"><form id="fm" novalidate><div class="top"><div><h3>Pesan ${v.n}</h3><p class="note" data-k="svc.dlg_note">Setelah kamu kirim, WhatsApp terbuka dengan pesan yang sudah tersusun.</p></div><button type="button" class="x" id="cl" aria-label="Tutup">×</button></div>
 ${v.f.map((f,i)=>{const o=f[2]?" <span>(boleh dikosongkan)</span>":"";const r=f[2]?"":"required";const c=f[1]=="choice"?`<select name="f${i}" ${r}><option value="">Pilih</option>${(f[3]||[]).map(o=>`<option>${o}</option>`).join("")}</select>`:f[1]=="area"?`<textarea name="f${i}" ${r}></textarea>`:`<input name="f${i}" type="${f[1]}" ${f[1]=="number"?'min="1" ':""}${r}>`;return`<label>${f[0]}${o}${c}</label>`}).join("")}
 <div class="err" id="er" role="alert"></div><button class="btn solid" type="submit" data-k="svc.btn_submit">Kirim lewat WhatsApp</button></form></dialog>`;
 const dl=document.getElementById("dlg");if(/pesan=1/.test(location.search))dl.showModal();
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>dl.showModal());
 document.getElementById("cl").onclick=()=>dl.close();
 document.getElementById("fm").onsubmit=e=>{e.preventDefault();
  const fm=e.target,L=[];let bad=0;
  v.f.forEach((f,i)=>{const val=fm["f"+i].value.trim();if(!val&&!f[2])bad=1;if(val)L.push(`${f[0]}: ${f[1]=="date"?val.split("-").reverse().join("/"):val}`)});
  if(bad){document.getElementById("er").textContent="Lengkapi kolom yang wajib diisi dulu.";return}
  window.open(wa(`${v.mh||"Assalamu'alaikum Akhawat, saya ingin memesan "+v.n+"."}\n\n${L.join("\n")}\n\nTerima kasih.`),"_blank");dl.close();fm.reset()};
}

const kf=document.getElementById("kf");
if(kf)kf.onsubmit=e=>{e.preventDefault();const n=kf.n.value.trim(),p=kf.p.value.trim();
 if(!n||!p){document.getElementById("ke").textContent="Isi nama dan pesan dulu.";return}
 window.open(wa(`Assalamu'alaikum Akhawat, saya ${n}.\n\n${p}`),"_blank");kf.reset()};

const sc=document.getElementById("svc-cards");
if(sc)sc.innerHTML=Object.entries(S).map(([k,v])=>`<article class="scard"><div class="sc-top"><span class="disc sm">${v.ic?`<img class="dimg" alt="" src="${v.ic}">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`}</span><div>${v.tg?`<span class="ctag">${v.tg}</span>`:""}<h3>${v.n}</h3></div></div><p>${v.intro}</p><ul class="list">${v.items.map(i=>`<li>${i}</li>`).join("")}</ul><div class="row"><a class="btn solid" href="layanan-${k}.html?pesan=1">${v.bo||"Pesan"}</a><a class="btn" href="${k=="store"?"store.html":"layanan-"+k+".html"}">${v.bd||"Lihat detail"}</a></div></article>`).join("");

</script><script src="tema.js" defer></script></body></html>
